<script>
    let operaciones = [];
    let lotes = [];
    let capitalInicial = 0;
    let fechaActualStr = new Date().toISOString().split('T')[0];
    let metaDiariaUSDC = 10.0;

    document.addEventListener("DOMContentLoaded", () => {
        cargarDatos();
        actualizarTextoFechaHeader();
    });

    // Función de navegación entre vistas (Dashboard, Resumen, etc.)
    function cambiarVista(vista, elemento) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        
        const vistaEl = document.getElementById('view-' + vista);
        if (vistaEl) vistaEl.classList.add('active');
        
        if (elemento) elemento.classList.add('active');
    }

    function abrirModalNuevaOp() {
        document.getElementById('modal-titulo-op').innerText = "Nueva Operación";
        document.getElementById('input-edit-id').value = "";
        document.getElementById('input-fecha-op').value = fechaActualStr;
        document.getElementById('input-usuario').value = "";
        document.getElementById('input-ref').value = "";
        document.getElementById('input-monto').value = "";
        document.getElementById('input-tasa').value = "";
        document.getElementById('input-monto-ves-manual').value = "";
        document.getElementById('input-comision-cripto').value = "0.00";
        toggleModal(true);
    }

    function toggleModal(mostrar) {
        const modal = document.getElementById('modal-op');
        if (modal) {
            modal.style.display = mostrar ? 'flex' : 'none';
            if (mostrar) calcularTotalesModal();
        }
    }

    function abrirModalResumenGanancias() {
        const modal = document.getElementById('modal-resumen-ganancias');
        if (modal) {
            modal.style.display = 'flex';
            actualizarCalculosResumenGanancias();
        }
    }

    function cerrarModalResumenGanancias() {
        const modal = document.getElementById('modal-resumen-ganancias');
        if (modal) modal.style.display = 'none';
    }

    function abrirModalPendientes() {
        const modal = document.getElementById('modal-pendientes');
        if (modal) {
            modal.style.display = 'flex';
            actualizarContenidoPendientes();
        }
    }

    function cerrarModalPendientes() {
        const modal = document.getElementById('modal-pendientes');
        if (modal) modal.style.display = 'none';
    }

    function abrirAnalisisSemanal() {
        const fechaRef = new Date(fechaActualStr + 'T00:00:00');
        const inicioSemana = new Date(fechaRef);
        inicioSemana.setDate(fechaRef.getDate() - 6);

        const opsSemana = operaciones.filter(op => {
            if(!op.fecha) return false;
            const dOp = new Date(op.fecha + 'T00:00:00');
            return dOp >= inicioSemana && dOp <= fechaRef;
        });

        const comprasSemana = opsSemana.filter(op => (op.tipo || '').toUpperCase() === 'COMPRA');
        const totalVes = comprasSemana.reduce((acc, op) => acc + (op.gananciaVes || 0), 0);
        const totalUsdc = comprasSemana.reduce((acc, op) => acc + (op.gananciaCripto || 0), 0);

        const contenido = document.getElementById('contenido-analisis-semanal');
        if (contenido) {
            contenido.innerHTML = `
                <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 12px;">
                    <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">ÚLTIMOS 7 DÍAS</div>
                    <div style="font-size:1.3rem; font-weight:bold; color:var(--accent-green);">${totalVes.toFixed(2)} VES</div>
                    <div style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">≈ ${totalUsdc.toFixed(4)} USDC</div>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">Total de operaciones en el periodo: <b>${opsSemana.length}</b></div>
            `;
        }
        const modal = document.getElementById('modal-analisis-semanal');
        if (modal) modal.style.display = 'flex';
    }

    function abrirAnalisisMensual() {
        const [yRef, mRef] = fechaActualStr.split('-');
        const opsMes = operaciones.filter(op => {
            if(!op.fecha) return false;
            const [yOp, mOp] = op.fecha.split('-');
            return yOp === yRef && mOp === mRef;
        });

        const comprasMes = opsMes.filter(op => (op.tipo || '').toUpperCase() === 'COMPRA');
        const totalVes = comprasMes.reduce((acc, op) => acc + (op.gananciaVes || 0), 0);
        const totalUsdc = comprasMes.reduce((acc, op) => acc + (op.gananciaCripto || 0), 0);

        const contenido = document.getElementById('contenido-analisis-mensual');
        if (contenido) {
            contenido.innerHTML = `
                <div style="background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 10px; padding: 14px; text-align: center; margin-bottom: 12px;">
                    <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;">MES ${mRef}/${yRef}</div>
                    <div style="font-size:1.3rem; font-weight:bold; color:var(--accent-green);">${totalVes.toFixed(2)} VES</div>
                    <div style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">≈ ${totalUsdc.toFixed(4)} USDC</div>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-muted);">Total de operaciones en el mes: <b>${opsMes.length}</b></div>
            `;
        }
        const modal = document.getElementById('modal-analisis-mensual');
        if (modal) modal.style.display = 'flex';
    }

    function abrirCalendario() {
        const inputDate = document.getElementById('input-fecha-calendario');
        if (inputDate) {
            inputDate.value = fechaActualStr;
            if (inputDate.showPicker) {
                inputDate.showPicker();
            } else {
                inputDate.click();
            }
        }
    }

    function seleccionarFechaCalendario(el) {
        if(el && el.value) {
            fechaActualStr = el.value;
            actualizarTextoFechaHeader();
            actualizarDashboard();
        }
    }

    function actualizarTextoFechaHeader() {
        const headerDate = document.getElementById('header-date');
        if (headerDate) {
            const [y, m, d] = fechaActualStr.split('-');
            headerDate.innerText = `${d}/${m}/${y}`;
        }
    }

    function editarCapital() {
        let cap = prompt("Ingresa el Capital Inicial registrado del día:", capitalInicial);
        if (cap !== null) {
            capitalInicial = parseFloat(cap) || 0;
            const txtCapital = document.getElementById('txt-capital');
            if (txtCapital) {
                txtCapital.innerText = capitalInicial > 0 ? capitalInicial + " VES registrado" : "No hay capital registrado para hoy.";
            }
            guardarDatos();
        }
    }

    function mostrarToast(mensaje = "✓ Operación guardada con éxito.") {
        const toast = document.getElementById('toast-aviso');
        if (toast) {
            toast.innerText = mensaje;
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 2500);
        }
    }

    function esPagoMovil(metodoStr) {
        if(!metodoStr) return false;
        const m = metodoStr.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
        return m.includes("pagomovil") || m.includes("pago movil");
    }

    function calcularComisionBancaria(tipoOp, metodoOp, montoBsVal) {
        let comision = 0.0;
        if (tipoOp === 'COMPRA' && esPagoMovil(metodoOp)) {
            let calculoPorcentaje = montoBsVal * 0.003;
            comision = Math.max(14.0, calculoPorcentaje);
        }
        return comision;
    }

    function alCambiarMontoVESManual() {
        const montoVesManual = parseFloat(document.getElementById('input-monto-ves-manual').value) || 0;
        const montoUSDC = parseFloat(document.getElementById('input-monto').value) || 0;

        if (montoVesManual > 0 && montoUSDC > 0) {
            const tasaCalc = montoVesManual / montoUSDC;
            document.getElementById('input-tasa').value = tasaCalc.toFixed(6);
        }
        calcularTotalesModal();
    }

    function alCambiarTasaOUSDC() {
        let tasa = parseFloat(document.getElementById('input-tasa').value) || 0;
        const montoUSDC = parseFloat(document.getElementById('input-monto').value) || 0;
        if (tasa > 0 && montoUSDC > 0) {
            document.getElementById('input-monto-ves-manual').value = (tasa * montoUSDC).toFixed(2);
        }
        calcularTotalesModal();
    }

    function calcularTotalesModal() {
        const monto = parseFloat(document.getElementById('input-monto').value) || 0;
        let tasa = parseFloat(document.getElementById('input-tasa').value) || 0;
        const comisionCripto = parseFloat(document.getElementById('input-comision-cripto').value) || 0;
        const tipo = document.getElementById('input-tipo').value.toUpperCase();
        const metodo = document.getElementById('input-metodo').value;
        
        const montoEfectivoCripto = monto - comisionCripto;
        
        let montoBs = 0;
        const vesManual = parseFloat(document.getElementById('input-monto-ves-manual').value) || 0;
        if (vesManual > 0) {
            montoBs = vesManual;
        } else {
            montoBs = montoEfectivoCripto * tasa;
        }
        
        let comisionBancaria = calcularComisionBancaria(tipo, metodo, montoBs);
        let total = (tipo === 'COMPRA') ? (montoBs + comisionBancaria) : (vesManual > 0 ? vesManual : montoBs);

        document.getElementById('modal-monto-bs').innerText = montoBs.toFixed(2);
        document.getElementById('modal-comision').innerText = comisionBancaria.toFixed(2);
        document.getElementById('modal-comision-cripto-txt').innerText = comisionCripto.toFixed(2) + " USDC";
        document.getElementById('modal-total').innerText = total.toFixed(2);
    }

    async function ejecutarPegadoEspecial() {
        try {
            if (navigator.clipboard && navigator.clipboard.readText) {
                const texto = await navigator.clipboard.readText();
                if (texto && texto.trim() !== "") {
                    procesarTextoInteligente(texto);
                    mostrarToast("✓ Pegado especial exitoso.");
                    return;
                } else {
                    alert("El portapapeles está vacío.");
                }
            } else {
                alert("Tu navegador no soporta el pegado automático directo.");
            }
        } catch (err) {
            console.error("Error al leer el portapapeles:", err);
            alert("Por favor, otorga permisos de acceso al portapapeles en tu navegador.");
        }
    }

    function procesarTextoInteligente(texto) {
        const textoLower = texto.toLowerCase();
        let esCompra = true;

        const matchEnviado = textoLower.match(/monto enviado:\s*([\d\.,]+)\s*([a-z]+/i);
        const matchRecibido = textoLower.match(/monto recibido:\s*([\d\.,]+)\s*([a-z]+/i);

        if (matchEnviado && matchRecibido) {
            let unidadEnviada = matchEnviado[2].toUpperCase();
            let unidadRecibida = matchRecibido[2].toUpperCase();
            
            if (unidadEnviada.includes('VES') || unidadEnviada.includes('BS')) {
                esCompra = true;
            } else if (unidadEnviada.includes('USDC') || unidadEnviada.includes('USD')) {
                esCompra = false;
            } else if (unidadRecibida.includes('VES') || unidadRecibida.includes('BS')) {
                esCompra = false;
            } else {
                esCompra = true;
            }
        } else {
            if (textoLower.includes('has vendido') || textoLower.includes('vendido') || textoLower.includes('venta')) {
                esCompra = false;
            } else if (textoLower.includes('has comprado') || textoLower.includes('comprado') || textoLower.includes('compra')) {
                esCompra = true;
            }
        }

        document.getElementById('input-tipo').value = esCompra ? 'COMPRA' : 'VENTA';

        let usuarioEncontrado = "";
        const matchContraparte = texto.match(/Contraparte:\s*([^\n\r]+)/i);
        if (matchContraparte) {
            usuarioEncontrado = matchContraparte[1].replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '').trim();
        }
        if (usuarioEncontrado) {
            document.getElementById('input-usuario').value = usuarioEncontrado;
        }

        const matchRef = texto.match(/([a-f0-9]{8}|[A-Z0-9]{6,12})/i);
        if (matchRef) {
            document.getElementById('input-ref').value = matchRef[1];
        }

        let montoUSDC = 0;
        const matchRecibidoUSDCVal = texto.match(/monto recibido:\s*(\d+([.,]\d+)?)\s*USDC/i);
        const matchEnviadoUSDCVal = texto.match(/monto enviado:\s*(\d+([.,]\d+)?)\s*USDC/i);
        const matchUSDCGeneral = texto.match(/(\d+([.,]\d+)?)\s*USDC/i);

        if (matchRecibidoUSDCVal) {
            montoUSDC = parseFloat(matchRecibidoUSDCVal[1].replace(',', '.'));
        } else if (matchEnviadoUSDCVal) {
            montoUSDC = parseFloat(matchEnviadoUSDCVal[1].replace(',', '.'));
        } else if (matchUSDCGeneral) {
            montoUSDC = parseFloat(matchUSDCGeneral[1].replace(',', '.'));
        }
        
        if (montoUSDC > 0) {
            document.getElementById('input-monto').value = montoUSDC;
        }

        let montoBsExtraido = 0;
        const matchRecibidoVES = texto.match(/monto recibido:\s*([\d\.,]+)\s*VES/i);
        const matchEnviadoVES = texto.match(/monto enviado:\s*([\d\.,]+)\s*VES/i);
        if (matchRecibidoVES) {
            montoBsExtraido = parseFloat(matchRecibidoVES[1].replace(/\./g, '').replace(',', '.'));
        } else if (matchEnviadoVES) {
            montoBsExtraido = parseFloat(matchEnviadoVES[1].replace(/\./g, '').replace(',', '.'));
        }

        const matchPrecio = texto.match(/precio:\s*([\d\.,]+)\s*VES/i);
        if (matchPrecio) {
            let precioExtraido = parseFloat(matchPrecio[1].replace(/\./g, '').replace(',', '.'));
            document.getElementById('input-tasa').value = precioExtraido.toFixed(6);
            if (montoUSDC > 0) {
                document.getElementById('input-monto-ves-manual').value = (precioExtraido * montoUSDC).toFixed(2);
            }
        } else if (montoBsExtraido > 0) {
            document.getElementById('input-monto-ves-manual').value = montoBsExtraido.toFixed(2);
            if (montoUSDC > 0) {
                let tasaExacta = montoBsExtraido / montoUSDC;
                document.getElementById('input-tasa').value = tasaExacta.toFixed(6);
            }
        }

        calcularTotalesModal();
    }

    function guardarOperacion() {
        try {
            const editId = document.getElementById('input-edit-id').value;
            const fechaOp = document.getElementById('input-fecha-op').value || fechaActualStr;
            const usuario = document.getElementById('input-usuario').value.trim() || 'N/A';
            const referencia = document.getElementById('input-ref').value.trim() || 'N/A';
            const estatus = document.getElementById('input-estatus').value;
            const tipo = document.getElementById('input-tipo').value.toUpperCase();
            const metodo = document.getElementById('input-metodo').value;
            
            const monto = parseFloat(document.getElementById('input-monto').value) || 0;
            const comisionCripto = parseFloat(document.getElementById('input-comision-cripto').value) || 0;
            let vesManual = parseFloat(document.getElementById('input-monto-ves-manual').value) || 0;
            let tasa = parseFloat(document.getElementById('input-tasa').value) || 0;

            if (monto <= 0) {
                alert("⚠️ Ingresa un Monto Cripto válido mayor a 0.");
                return;
            }

            if (tasa <= 0 && vesManual > 0) {
                tasa = vesManual / monto;
            }
            if (vesManual <= 0 && tasa > 0) {
                vesManual = monto * tasa;
            }
            if (vesManual <= 0) {
                vesManual = monto * (tasa > 0 ? tasa : 1);
            }

            let totalBsFinal = 0;
            if (tipo === 'COMPRA') {
                let comisionBancaria = calcularComisionBancaria(tipo, metodo, vesManual);
                totalBsFinal = vesManual + comisionBancaria;
            } else {
                totalBsFinal = vesManual;
            }

            if (editId) {
                const index = operaciones.findIndex(o => o.id == editId);
                if (index !== -1) {
                    operaciones[index].fecha = fechaOp;
                    operaciones[index].usuario = usuario;
                    operaciones[index].referencia = referencia;
                    operaciones[index].estatus = estatus;
                    operaciones[index].tipo = tipo;
                    operaciones[index].metodo = metodo;
                    operaciones[index].monto = monto;
                    operaciones[index].tasa = tasa > 0 ? tasa : 1;
                    operaciones[index].comisionCripto = comisionCripto;
                    operaciones[index].montoBs = totalBsFinal;
                }
            } else {
                const nuevaOp = {
                    id: Date.now(),
                    usuario, 
                    referencia, 
                    estatus, 
                    tipo, 
                    metodo, 
                    monto, 
                    tasa: tasa > 0 ? tasa : 1, 
                    comisionCripto, 
                    montoBs: totalBsFinal,
                    fecha: fechaOp
                };
                operaciones.unshift(nuevaOp);
            }

            recalcularLotesMotor();
            guardarDatos();
            actualizarDashboard();
            toggleModal(false);
            
            const modalDetalle = document.getElementById('modal-detalle-op');
            if (modalDetalle) modalDetalle.style.display = 'none';
            
            mostrarToast("✓ Operación guardada con éxito.");
        } catch (err) {
            console.error("Error al guardar:", err);
            alert("Error al guardar: " + err.message);
        }
    }

    function editarOp(id) {
        const op = operaciones.find(o => o.id === id);
        if(!op) return;

        document.getElementById('modal-titulo-op').innerText = "Editar Operación";
        document.getElementById('input-edit-id').value = op.id;
        document.getElementById('input-fecha-op').value = op.fecha || fechaActualStr;
        document.getElementById('input-usuario').value = op.usuario;
        document.getElementById('input-ref').value = op.referencia;
        document.getElementById('input-estatus').value = op.estatus;
        document.getElementById('input-tipo').value = (op.tipo || 'COMPRA').toUpperCase();
        document.getElementById('input-metodo').value = op.metodo || 'Pagomóvil';
        document.getElementById('input-monto').value = op.monto;
        document.getElementById('input-tasa').value = op.tasa;
        document.getElementById('input-monto-ves-manual').value = op.montoBs.toFixed(2);
        document.getElementById('input-comision-cripto').value = op.comisionCripto || 0;

        document.getElementById('modal-detalle-op').style.display = 'none';
        toggleModal(true);
    }

    function pedirConfirmacionMover(id, direccion) {
        document.getElementById('mover-id-op').value = id;
        document.getElementById('mover-dir-op').value = direccion;
        document.getElementById('modal-mover-op').style.display = 'flex';
    }

    function cerrarModalMover() {
        document.getElementById('modal-mover-op').style.display = 'none';
    }

    function ejecutarMovimientoOp() {
        const id = parseInt(document.getElementById('mover-id-op').value);
        const direccion = document.getElementById('mover-dir-op').value;
        cerrarModalMover();

        const index = operaciones.findIndex(o => o.id === id);
        if (index === -1) return;

        if (direccion === 'arriba' && index > 0) {
            const temp = operaciones[index];
            operaciones[index] = operaciones[index - 1];
            operaciones[index - 1] = temp;
        } else if (direccion === 'abajo' && index < operaciones.length - 1) {
            const temp = operaciones[index];
            operaciones[index] = operaciones[index + 1];
            operaciones[index + 1] = temp;
        }

        recalcularLotesMotor();
        guardarDatos();
        actualizarDashboard();
        mostrarToast("✓ Orden actualizado. Recalculando...");
    }

    function recalcularLotesMotor() {
        let lotesActivos = [];
        let contadorLote = 1;
        
        operaciones.forEach(op => {
            op.gananciaVes = 0;
            op.gananciaCripto = 0;
            op.loteTag = '';
            op.loteObj = null;
            op.lotesConsumidos = [];
        });

        const opsCronologico = [...operaciones].reverse();

        opsCronologico.forEach(op => {
            const tipoUpper = (op.tipo || '').toUpperCase();
            if (tipoUpper === 'VENTA') {
                const nuevoLote = {
                    idTag: 'L' + contadorLote,
                    tasaVenta: op.tasa,
                    montoInicial: op.monto,
                    montoRestante: op.monto,
                    estado: 'ABIERTO',
                    fecha: op.fecha,
                    consumos: []
                };
                contadorLote++;
                lotesActivos.push(nuevoLote);
                op.loteObj = nuevoLote;
                op.loteTag = nuevoLote.idTag;
            } else if (tipoUpper === 'COMPRA') {
                let montoPorCubrir = op.monto;
                let gananciaVesTotal = 0;
                let gananciaUsdcTotal = 0;
                let descLotes = [];
                let consumosCompra = [];

                for (let lote of lotesActivos) {
                    if (lote.estado === 'ABIERTO' && montoPorCubrir > 0) {
                        let asignado = Math.min(lote.montoRestante, montoPorCubrir);
                        let difTasa = lote.tasaVenta - op.tasa;
                        let gVes = difTasa * asignado;
                        let gUsdc = gVes / lote.tasaVenta;

                        gananciaVesTotal += gVes;
                        gananciaUsdcTotal += gUsdc;

                        lote.montoRestante -= asignado;
                        montoPorCubrir -= asignado;

                        descLotes.push(`${lote.idTag}(${asignado.toFixed(2)})`);
                        consumosCompra.push({ loteTag: lote.idTag, monto: asignado });
                        lote.consumos.push({ 
                            usuarioCompra: op.usuario, 
                            monto: asignado, 
                            fecha: op.fecha 
                        });

                        if (lote.montoRestante <= 0.001) {
                            lote.estado = 'CERRADO';
                        }
                    }
                }

                op.gananciaVes = gananciaVesTotal;
                op.gananciaCripto = gananciaUsdcTotal;
                op.lotesConsumidos = consumosCompra;
                op.loteTag = descLotes.length > 0 ? descLotes.join(', ') : 'N/A';
            }
        });

        lotes = lotesActivos;
        actualizarRatings();
    }

    function actualizarDashboard() {
        const opsDelDia = operaciones.filter(op => op.fecha === fechaActualStr);
        const comprasDia = opsDelDia.filter(op => (op.tipo || '').toUpperCase() === 'COMPRA');
        const ventasDia = opsDelDia.filter(op => (op.tipo || '').toUpperCase() === 'VENTA');

        const gananciaDiaCripto = comprasDia.reduce((acc, op) => acc + (op.gananciaCripto || 0), 0);
        const gananciaDiaVes = comprasDia.reduce((acc, op) => acc + (op.gananciaVes || 0), 0);

        document.getElementById('dash-ganancia-dia-usdc').innerHTML = gananciaDiaCripto.toFixed(4) + ' <span style="font-size: 1.1rem;">USDC</span>';
        document.getElementById('dash-ganancia-dia-ves').innerText = gananciaDiaVes.toFixed(2) + " VES";

        let pctMeta = Math.min(100, (gananciaDiaCripto / metaDiariaUSDC) * 100);
        document.getElementById('meta-diaria-fill').style.width = pctMeta + '%';
        document.getElementById('meta-diaria-progreso').innerText = `${gananciaDiaCripto.toFixed(2)} / ${metaDiariaUSDC.toFixed(2)} USDC (Meta Día)`;
        document.getElementById('meta-diaria-pct').innerText = pctMeta.toFixed(0) + '%';

        const promCompra = comprasDia.length > 0 ? comprasDia.reduce((acc, op) => acc + op.tasa, 0) / comprasDia.length : 0;
        const promVenta = ventasDia.length > 0 ? ventasDia.reduce((acc, op) => acc + op.tasa, 0) / ventasDia.length : 0;
        
        let brecha = 0;
        if (promCompra > 0 && promVenta > 0) {
            brecha = ((promVenta - promCompra) / promCompra) * 100;
        }

        const lotesAbiertosDia = lotes.filter(l => l.fecha === fechaActualStr && l.estado === 'ABIERTO').length;

        const totalRecompraPendienteDia = lotes.filter(l => l.fecha === fechaActualStr && l.estado === 'ABIERTO').reduce((acc, l) => acc + l.montoRestante, 0);
        const totalComprasCriptoDia = comprasDia.reduce((acc, op) => acc + op.monto, 0);
        const totalVentasCriptoDia = ventasDia.reduce((acc, op) => acc + op.monto, 0);
        const totalReventaPendienteDia = Math.max(0, totalComprasCriptoDia - totalVentasCriptoDia);
        const totalPendientesUSDCDia = totalRecompraPendienteDia + totalReventaPendienteDia;

        document.getElementById('dash-prom-compra').innerText = promCompra.toFixed(2);
        document.getElementById('dash-prom-venta').innerText = promVenta.toFixed(2);
        document.getElementById('dash-brecha').innerText = brecha.toFixed(2) + "%";
        document.getElementById('dash-total-ops').innerText = opsDelDia.length;
        document.getElementById('dash-lotes').innerText = lotesAbiertosDia;
        document.getElementById('dash-ganancia-cripto').innerText = gananciaDiaCripto.toFixed(2);
        document.getElementById('dash-pendientes').innerText = totalPendientesUSDCDia.toFixed(2) + " USDC";
        
        document.getElementById('txt-meta').innerText = gananciaDiaCripto.toFixed(2) + " / 1000.00 USDC";
        let metaPct = Math.min(100, (gananciaDiaCripto / 1000) * 100);
        document.getElementById('txt-meta-pct').innerText = metaPct.toFixed(0) + "%";

        filtrarHistorial();
    }

    function actualizarCalculosResumenGanancias() {
        const opsHoy = operaciones.filter(op => op.fecha === fechaActualStr && (op.tipo || '').toUpperCase() === 'COMPRA');
        const gHoyVes = opsHoy.reduce((acc, op) => acc + (op.gananciaVes || 0), 0);
        const gHoyUsdc = opsHoy.reduce((acc, op) => acc + (op.gananciaCripto || 0), 0);

        const fechaRef = new Date(fechaActualStr + 'T00:00:00');
        const inicioSemana = new Date(fechaRef);
        inicioSemana.setDate(fechaRef.getDate() - 6);
        
        const opsSemana = operaciones.filter(op => {
            if(!op.fecha) return false;
            const dOp = new Date(op.fecha + 'T00:00:00');
            return dOp >= inicioSemana && dOp <= fechaRef && (op.tipo || '').toUpperCase() === 'COMPRA';
        });
        const gSemVes = opsSemana.reduce((acc, op) => acc + (op.gananciaVes || 0), 0);
        const gSemUsdc = opsSemana.reduce((acc, op) => acc + (op.gananciaCripto || 0), 0);

        const [yRef, mRef] = fechaActualStr.split('-');
        const opsMes = operaciones.filter(op => {
            if(!op.fecha) return false;
            const [yOp, mOp] = op.fecha.split('-');
            return yOp === yRef && mOp === mRef && (op.tipo || '').toUpperCase() === 'COMPRA';
        });
        const gMesVes = opsMes.reduce((acc, op) => acc + (op.gananciaVes || 0), 0);
        const gMesUsdc = opsMes.reduce((acc, op) => acc + (op.gananciaCripto || 0), 0);

        document.getElementById('res-ganancia-hoy-ves').innerText = gHoyVes.toFixed(2) + " VES";
        document.getElementById('res-ganancia-hoy-usdc').innerText = gHoyUsdc.toFixed(4) + " USDC";

        document.getElementById('res-ganancia-sem-ves').innerText = gSemVes.toFixed(2) + " VES";
        document.getElementById('res-ganancia-sem-usdc').innerText = gSemUsdc.toFixed(4) + " USDC";

        document.getElementById('res-ganancia-mes-ves').innerText = gMesVes.toFixed(2) + " VES";
        document.getElementById('res-ganancia-mes-usdc').innerText = gMesUsdc.toFixed(4) + " USDC";
    }

    function actualizarContenidoPendientes() {
        const lotesAbiertos = lotes.filter(l => l.fecha === fechaActualStr && l.estado === 'ABIERTO');
        const totalRecompra = lotesAbiertos.reduce((acc, l) => acc + l.montoRestante, 0);

        const opsDelDia = operaciones.filter(op => op.fecha === fechaActualStr);
        const comprasTotales = opsDelDia.filter(op => (op.tipo || '').toUpperCase() === 'COMPRA');
        const ventasTotales = opsDelDia.filter(op => (op.tipo || '').toUpperCase() === 'VENTA');
        const totalComprasCripto = comprasTotales.reduce((acc, op) => acc + op.monto, 0);
        const totalVentasCripto = ventasTotales.reduce((acc, op) => acc + op.monto, 0);

        const totalReventa = Math.max(0, totalComprasCripto - totalVentasCripto);

        document.getElementById('pend-recompra-monto').innerText = totalRecompra.toFixed(2) + " USDC";
        document.getElementById('pend-reventa-monto').innerText = totalReventa.toFixed(2) + " USDC";

        document.getElementById('lista-recompra-pendientes').innerHTML = lotesAbiertos.length > 0 ? 
            lotesAbiertos.map(l => `<div>• Lote ${l.idTag} - Falta recomprar: <b>${l.montoRestante.toFixed(2)} USDC</b></div>`).join('') : 
            'No hay recompra pendiente.';

        const reventaPendienteOps = opsDelDia.filter(op => op.estatus === 'En Curso' && (op.tipo || '').toUpperCase() === 'VENTA');
        
        let htmlReventa = '';
        if (totalReventa > 0) {
            htmlReventa += `<div style="margin-bottom:4px; color: var(--accent-orange);">• Inventario disponible por colocar: <b>${totalReventa.toFixed(2)} USDC</b></div>`;
        }
        if (reventaPendienteOps.length > 0) {
            htmlReventa += reventaPendienteOps.map(op => `<div>• En Curso con ${op.usuario} - Ref: ${op.referencia} (<b>${op.monto.toFixed(2)} USDC</b>)</div>`).join('');
        }
        if (!htmlReventa) {
            htmlReventa = 'No hay reventa pendiente.';
        }

        document.getElementById('lista-reventa-pendientes').innerHTML = htmlReventa;
    }

    function actualizarRatings() {
        const container = document.getElementById('ratings-container');
        if (!container) return;
        const usuariosMap = {};
        
        operaciones.forEach(op => {
            if(op.usuario && op.usuario !== 'N/A') {
                if(!usuariosMap[op.usuario]) {
                    usuariosMap[op.usuario] = { totalOps: 0, completadas: 0 };
                }
                usuariosMap[op.usuario].totalOps++;
                if(op.estatus === 'Completado') {
                    usuariosMap[op.usuario].completadas++;
                }
            }
        });

        const keys = Object.keys(usuariosMap);
        if(keys.length === 0) {
            container.innerHTML = `<div style="text-align: center; color: var(--text-muted); padding: 40px;">Sin calificaciones aún.</div>`;
            return;
        }

        let html = '';
        keys.forEach(usr => {
            const data = usuariosMap[usr];
            html += `
                <div class="neon-card" style="padding: 12px; margin-bottom: 8px; cursor: default;">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <span style="font-weight:bold; font-size:0.95rem;">${usr}</span>
                        <span style="color:var(--accent-green); font-size:0.85rem; font-weight:bold;">5.0 ★</span>
                    </div>
                    <div style="font-size:0.75rem; color:var(--text-muted); margin-top:4px;">
                        Operaciones registradas: <b>${data.totalOps}</b> (${data.completadas} completadas)
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function filtrarHistorial() {
        const qInput = document.getElementById('busqueda-filtro');
        const tipoInput = document.getElementById('filtro-tipo');
        const metodoInput = document.getElementById('filtro-metodo');

        const q = qInput ? qInput.value.toLowerCase() : '';
        const tipoFiltro = tipoInput ? tipoInput.value.toUpperCase() : 'TODAS';
        const metodoFiltro = metodoInput ? metodoInput.value : 'Todos';

        const filtradas = operaciones.filter(op => {
            const matchFecha = op.fecha === fechaActualStr;
            const matchQ = op.usuario.toLowerCase().includes(q) || op.referencia.toLowerCase().includes(q);
            const opTipoUpper = (op.tipo || '').toUpperCase();
            const matchTipo = (tipoFiltro === 'TODAS' || opTipoUpper === tipoFiltro);
            const matchMetodo = (metodoFiltro === 'Todos' || op.metodo === metodoFiltro);
            return matchFecha && matchQ && matchTipo && matchMetodo;
        });

        renderizarHistorial(filtradas);
    }

    function eliminarOp(id) {
        if(confirm("¿Seguro que quieres eliminar esta operación?")) {
            operaciones = operaciones.filter(op => op.id !== id);
            recalcularLotesMotor();
            guardarDatos();
            actualizarDashboard();
        }
    }

    function exportarDatosJSON() {
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify({ operaciones, capitalInicial }));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `syklo_backup_${fechaActualStr}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    function importarDatosJSON(event) {
        const fileReader = new FileReader();
        if (event.target.files[0]) {
            fileReader.readAsText(event.target.files[0], "UTF-8");
            fileReader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    operaciones = parsed.operaciones || [];
                    capitalInicial = parsed.capitalInicial || 0;
                    const txtCapital = document.getElementById('txt-capital');
                    if(capitalInicial > 0 && txtCapital) txtCapital.innerText = capitalInicial + " VES registrado";
                    recalcularLotesMotor();
                    guardarDatos();
                    actualizarDashboard();
                    alert("¡Datos importados con éxito!");
                } catch (err) {
                    alert("El archivo no es válido.");
                }
            };
        }
    }

    function borrarTodo() {
        if (confirm("¿Restablecer todos los datos?")) {
            operaciones = [];
            lotes = [];
            capitalInicial = 0;
            guardarDatos();
            actualizarDashboard();
        }
    }

    function guardarDatos() {
        const datosLimpios = operaciones.map(op => ({
            id: op.id,
            usuario: op.usuario,
            referencia: op.referencia,
            estatus: op.estatus,
            tipo: op.tipo,
            metodo: op.metodo,
            monto: op.monto,
            tasa: op.tasa,
            comisionCripto: op.comisionCripto,
            montoBs: op.montoBs,
            fecha: op.fecha
        }));
        localStorage.setItem('syklo_tracker_data', JSON.stringify({ operaciones: datosLimpios, capitalInicial }));
    }

    function cargarDatos() {
        const data = localStorage.getItem('syklo_tracker_data');
        if (data) {
            const parsed = JSON.parse(data);
            operaciones = parsed.operaciones || [];
            capitalInicial = parsed.capitalInicial || 0;
            const txtCapital = document.getElementById('txt-capital');
            if(capitalInicial > 0 && txtCapital) txtCapital.innerText = capitalInicial + " VES registrado";
            recalcularLotesMotor();
            actualizarDashboard();
        }
    }
